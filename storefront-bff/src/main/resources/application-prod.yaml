spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - SaveSession
          routes:
            - id: product
              uri: http://product
              predicates:
                - Path=/api/product/**
              filters:
                - StripPrefix=1
            - id: cart
              uri: http://cart
              predicates:
                - Path=/api/cart/**
            - id: customer
              uri: http://customer
              predicates:
                - Path=/api/customer/**
            - id: order
              uri: http://order
              predicates:
                - Path=/api/order/**
            - id: inventory
              uri: http://inventory
              predicates:
                - Path=/api/inventory/**
            - id: media
              uri: http://media
              predicates:
                - Path=/api/media/**
            - id: search
              uri: http://search
              predicates:
                - Path=/api/search/**
            - id: tax
              uri: http://tax
              predicates:
                - Path=/api/tax/**
            - id: promotion
              uri: http://promotion
              predicates:
                - Path=/api/promotion/**
                
              filters:
                - StripPrefix=1
            - id: api
              uri: http://nginx
              predicates:
                - Path=/api/**
              filters:
                - DedupeResponseHeader=Origin Access-Control-Request-Method Access-Control-Request-Headers
                - TokenRelay=
                - StripPrefix=1
            - id: nextjs
              uri: http://storefront-ui:3000
              predicates:
                - Path=/**