backend:
  image:
    repository: 23127206/yas-all-in-one
    tag: latest
    pullPolicy: Always

  service:
    type: NodePort
    nodePort: 30011

  livenessProbe:
    initialDelaySeconds: 120
  readinessProbe:
    initialDelaySeconds: 120

  nameOverride: backoffice-bff
  fullnameOverride: backoffice-bff

  deployment:
    annotations:
      configmap.reloader.stakater.com/reload: "yas-gateway-routes-config-configmap,backoffice-bff-extra-configmap"

  ingress:
    enabled: false

  extraVolumes:
    - name: yas-gateway-routes-config
      configMap:
        name: yas-gateway-routes-config-configmap
    - name: backoffice-bff-extra-config
      configMap:
        name: backoffice-bff-extra-configmap

  extraVolumeMounts:
    - name: yas-gateway-routes-config
      mountPath: /opt/yas/gateway-routes-config
    - name: backoffice-bff-extra-config
      mountPath: /opt/yas/extra-config

  extraApplicationConfigPaths:
    - /opt/yas/gateway-routes-config/gateway-routes-config.yaml
    - /opt/yas/extra-config/backoffice-bff-extra-config.yaml

  extraEnvFroms:
    - secretRef:
        name: yas-keycloak-credentials-secret
    - secretRef:
        name: yas-redis-credentials-secret

  extraEnvs:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: UI_HOST
      value: "http://backoffice-ui:3000"
    - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
      value: "http://yas.local.com:30016/realms/Yas"
    - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
      value: "http://identity:80/realms/Yas/protocol/openid-connect/certs"
    - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI
      value: "http://yas.local.com:30016/realms/Yas/protocol/openid-connect/auth"
    - name: SERVER_FORWARD_HEADERS_STRATEGY
      value: "framework"
    - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI
      value: "http://identity:80/realms/Yas/protocol/openid-connect/token"
    - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI
      value: "http://identity:80/realms/Yas/protocol/openid-connect/userinfo"
    - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_API_CLIENT_CLIENT_ID
      value: "backoffice-bff"
    - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_API_CLIENT_PROVIDER
      value: "keycloak"
    - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_API_CLIENT_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: yas-keycloak-credentials-secret
          key: backoffice-bff-secret
    - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_API_CLIENT_AUTHORIZATION_GRANT_TYPE
      value: "authorization_code"
    - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_API_CLIENT_REDIRECT_URI
      value: "http://yas.local.com:30016/login/oauth2/code/api-client"
    - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_API_CLIENT_SCOPE
      value: "openid,profile,email"
    - name: YAS_SERVICES_PRODUCT
      value: "http://product"
    - name: YAS_SERVICES_CART
      value: "http://cart"
    - name: YAS_SERVICES_CUSTOMER
      value: "http://customer"
    - name: YAS_SERVICES_ORDER
      value: "http://order"
    - name: YAS_SERVICES_LOCATION
      value: "http://location"
    - name: YAS_SERVICES_INVENTORY
      value: "http://inventory"
    - name: YAS_SERVICES_TAX
      value: "http://tax"
    - name: YAS_SERVICES_MEDIA
      value: "http://media"

  metrics:
    enabled: false
  serviceMonitor:
    enabled: false