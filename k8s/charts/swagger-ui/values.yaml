# Default values for swagger-ui.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: swaggerapi/swagger-ui
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v4.16.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  sidecar.istio.io/rewriteAppHTTPProbers: "false"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}

baseUrl: /
urls: |
  [
    { "url": "http://product:80/v3/api-docs", "name": "Product" },
    { "url": "http://media:80/v3/api-docs", "name": "Media" },
    { "url": "http://customer:80/v3/api-docs", "name": "Customer" },
    { "url": "http://cart:80/v3/api-docs", "name": "Cart" },
    { "url": "http://order:80/v3/api-docs", "name": "Order" },
    { "url": "http://location:80/v3/api-docs", "name": "Location" },
    { "url": "http://inventory:80/v3/api-docs", "name": "Inventory" },
    { "url": "http://tax:80/v3/api-docs", "name": "Tax" },
    { "url": "http://search:80/v3/api-docs", "name": "Search" }
  ]

service:
  type: NodePort      # Đổi từ ClusterIP sang NodePort để bro trực tiếp truy cập test bên ngoài
  port: 80            # Chuẩn hóa cổng nội bộ Mesh là 80
  targetPort: 80      # Trỏ thẳng vào containerPort 80 thực tế của Pod để tránh lỗi 500 probe
  nodePort: 30012     # Giữ lại cổng NodePort truy cập từ trình duyệt máy bro

ingress:
  enabled: false      # Tạm thời tắt Ingress vì bro đang demo Service Mesh nội bộ bằng NodePort/Gateway
  className: "nginx"
  host: api.yas.local.com
  annotations: {}
  hosts:
    - host: api.yas.local.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}