replicaCount: 1

image:
  repository: swaggerapi/swagger-ui
  pullPolicy: IfNotPresent
  tag: "v4.16.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "true"                  # BẬT LẠI SIDECAR ĐỂ LÊN ĐẸP ĐỘI HÌNH 2/2
  sidecar.istio.io/rewriteAppHTTPProbers: "false"  # Ép Istio không chặn đường kiểm tra sức khỏe

podSecurityContext: {}

securityContext: {}

baseUrl: /
urls: "[{\"url\":\"http://yas.local.com/product/v3/api-docs\",\"name\":\"Product\"},{\"url\":\"http://yas.local.com/media/v3/api-docs\",\"name\":\"Media\"},{\"url\":\"http://yas.local.com/customer/v3/api-docs\",\"name\":\"Customer\"},{\"url\":\"http://yas.local.com/cart/v3/api-docs\",\"name\":\"Cart\"},{\"url\":\"http://yas.local.com/order/v3/api-docs\",\"name\":\"Order\"},{\"url\":\"http://yas.local.com/location/v3/api-docs\",\"name\":\"Location\"},{\"url\":\"http://yas.local.com/inventory/v3/api-docs\",\"name\":\"Inventory\"},{\"url\":\"http://yas.local.com/tax/v3/api-docs\",\"name\":\"Tax\"},{\"url\":\"http://yas.local.com/search/v3/api-docs\",\"name\":\"Search\"}]"

service:
  type: NodePort      
  port: 80            
  targetPort: 8080    
  nodePort: 30012     

ingress:
  enabled: false      
  className: "nginx"
  host: api.yas.local.com
  annotations: {}
  hosts:
    - host: api.yas.local.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}