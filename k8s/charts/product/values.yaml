backend:
  image:
    repository: 23127206/yas-all-in-one
    tag: latest
    pullPolicy: Always

  service:
    type: NodePort
    port: 80
    targetPort: 8080
    nodePort: 30008

  podAnnotations:    
    proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'

  livenessProbe:
    initialDelaySeconds: 120
  readinessProbe:
    initialDelaySeconds: 120

  nameOverride: product
  fullnameOverride: product
  
  databaseConnectionUrl: "jdbc:postgresql://postgres:5432"
  databaseName: product
  
  ingress:
    enabled: false

  extraVolumes:
    - name: product-application-config
      configMap:
        name: product-application-configmap
  extraVolumeMounts:
    - name: product-application-config
      mountPath: /opt/yas/product
  extraApplicationConfigPaths:
    - /opt/yas/product/product-application.yaml

  extraEnvs:
    - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
      value: "http://yas.local.com:30000/realms/Yas"
    - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
      value: "http://identity:80/realms/Yas/protocol/openid-connect/certs"
    - name: YAS_LOCATION_URL
      value: "http://location"
    - name: SPRING_APPLICATION_JSON
      value: '{"management":{"endpoints":{"web":{"exposure":{"include":"health,info,prometheus"}}}}}'

  metrics:
    enabled: true
  serviceMonitor:
    enabled: true