apiVersion: v1
kind: Service
metadata:
  name: yas-identity
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.backend.service.type | default "NodePort" }}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: identity
