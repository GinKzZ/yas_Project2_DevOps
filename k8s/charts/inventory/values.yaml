backend:
  image:
    repository: 23127206/yas-all-in-one
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    nodePort: 30007

  livenessProbe:
    initialDelaySeconds: 120
  readinessProbe:
    initialDelaySeconds: 120

  nameOverride: inventory
  fullnameOverride: inventory
  
  databaseConnectionUrl: "jdbc:postgresql://postgres-postgresql:5432"
  databaseName: inventory
  
  ingress:
    enabled: false

  extraEnvs:
    - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
      value: "http://yas.local.com:30000/realms/Yas"
    - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
      value: "http://yas-identity:80/realms/Yas/protocol/openid-connect/certs"
    - name: YAS_LOCATION_URL
      value: "http://location"

  metrics:
    enabled: false
  serviceMonitor:
    enabled: false