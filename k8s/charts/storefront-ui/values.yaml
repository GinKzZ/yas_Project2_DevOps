ui:
  image:
    repository: ghcr.io/nashtech-garage/yas-storefront
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  extraEnvs:
    - name: API_BASE_PATH
      value: "http://storefront-bff:80"

nameOverride: storefront-ui
fullnameOverride: storefront-ui

ingress:
  enabled: false
