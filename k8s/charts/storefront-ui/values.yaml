ui:
  image:
    repository: ghcr.io/nashtech-garage/yas-storefront
    tag: latest
    pullPolicy: IfNotPresent

  nameOverride: storefront-ui
  fullnameOverride: storefront-ui

  extraEnvs:
    - name: API_BASE_PATH
      value: http://<IP_CUA_GOOGLE_CLOUD>/api 

  service:
    type: LoadBalancer
    port: 80

  ingress:
    enabled: false